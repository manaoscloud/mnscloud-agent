name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the code: tests, builds and artifact uploads need no write access.
# Publishing happens in auto-release.yml, which declares its own permissions.
permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Deno agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno task check
      - name: Installed runtime package
        run: python scripts/test-runtime-package.py
      - name: Host metrics tests
        run: deno test --allow-all host-metrics_test.ts host-resources_test.ts bounded-io_test.ts schema-release_test.ts openvault-status_test.ts database-maintenance_test.ts runtime-reconcile_test.ts database-principal_test.ts pabx-state_test.ts pabx-registration-insight_test.ts webapps-status_test.ts webapps-update_test.ts nginx-webapps_test.ts scheduler_test.ts logs-refresh_test.ts
      - name: Shell syntax check
        run: bash -n scripts/*.sh
      - name: SSH diagnostics contract
        run: python3 tests/ssh_diagnostics_contract.py
      - name: SSH diagnostics lifecycle (disposable container)
        run: bash tests/ssh_diagnostics_integration.sh
      - name: Shared Deno runtime selection
        run: bash scripts/test-deno-selection.sh
      - name: apt/dpkg lock wait
        run: bash scripts/test-apt-lock-wait.sh
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest dir /repo --config=/repo/.gitleaks.toml --redact --verbose --exit-code=1
      - name: Trivy security scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:latest fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code=1 /repo
      - name: Prepare release candidate
        if: github.event_name == 'push'
        run: >-
          bash scripts/prepare-release-candidate.sh
          --output release-candidate
          --source-sha "${{ github.sha }}"
      - name: Upload release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mnscloud-agent-release-candidate
          path: release-candidate/release-candidate.json
          if-no-files-found: error
          retention-days: 7

  windows-metrics:
    name: Windows host telemetry
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Installed runtime package
        run: python scripts/test-runtime-package.py
      - name: Host metrics tests
        run: deno test --allow-all host-metrics_test.ts host-resources_test.ts bounded-io_test.ts schema-release_test.ts openvault-status_test.ts database-maintenance_test.ts runtime-reconcile_test.ts database-principal_test.ts pabx-state_test.ts pabx-registration-insight_test.ts webapps-status_test.ts webapps-update_test.ts nginx-webapps_test.ts scheduler_test.ts logs-refresh_test.ts
      - name: Installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install-agent-windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
